name: Publish Signed CPEB Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v1.2.0
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: cpeb-signed-android-release
  cancel-in-progress: false

jobs:
  signed-release:
    name: Build, verify, and publish signed release APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: apps/android

    env:
      CPEB_RELEASE_API_BASE_URL: ${{ secrets.CPEB_RELEASE_API_BASE_URL }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Validate release configuration
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -n "$CPEB_RELEASE_API_BASE_URL"
          case "$CPEB_RELEASE_API_BASE_URL" in https://*) ;; *) echo "Release backend must use HTTPS"; exit 1;; esac
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "Release tag must look like v1.2.0 or v1.2.0-rc.1"
            exit 1
          fi

          VERSION_NAME="$(
            sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts |
            head -1
          )"
          test -n "$VERSION_NAME"
          test "$RELEASE_TAG" = "v$VERSION_NAME"

          NORMALIZED_API_BASE="${CPEB_RELEASE_API_BASE_URL%/}"
          test "$NORMALIZED_API_BASE" = "https://cpeb-university-booking-api-v4.onrender.com"
          test -n "$KEYSTORE_B64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/cpeb-release.jks"
          test -s "$RUNNER_TEMP/cpeb-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/cpeb-release.jks" >> "$GITHUB_ENV"

      - name: Require live production backend readiness
        working-directory: .
        run: |
          python3 - <<'PY'
          import json
          import os
          import ssl
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base = os.environ['CPEB_RELEASE_API_BASE_URL'].rstrip('/') + '/'
          url = urllib.parse.urljoin(base, 'readiness')
          context = ssl.create_default_context()
          last_error = None

          for attempt in range(1, 6):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={'User-Agent': 'CPEB-Release-Gate/1.0'},
                  )
                  with urllib.request.urlopen(
                      request,
                      timeout=60,
                      context=context,
                  ) as response:
                      if response.status != 200:
                          raise RuntimeError(
                              f'Backend readiness returned HTTP {response.status}'
                          )
                      payload = json.load(response)

                  if payload.get('status') != 'ready':
                      raise RuntimeError('Backend is not ready')
                  if payload.get('database') != 'connected':
                      raise RuntimeError('Backend database is not connected')
                  if int(payload.get('resources', 0)) < 1:
                      raise RuntimeError('Backend has no resources')
                  if payload.get('emailVerification') not in {'smtp', 'smtp-connected'}:
                      raise RuntimeError('Real SMTP verification is not ready')
                  if payload.get('mailTransport') != 'connected':
                      raise RuntimeError('SMTP transport is not connected')

                  print(
                      'Production backend readiness gate passed '
                      f'on attempt {attempt}'
                  )
                  break
              except (
                  TimeoutError,
                  OSError,
                  RuntimeError,
                  urllib.error.URLError,
                  urllib.error.HTTPError,
              ) as exc:
                  last_error = exc
                  print(
                      f'Readiness attempt {attempt}/5 failed: {exc}',
                      flush=True,
                  )
                  if attempt == 5:
                      raise SystemExit(
                          f'Production backend readiness failed after retries: {last_error}'
                      )
                  time.sleep(10)
          PY

      - name: Require successful CI for this exact release commit
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUNS="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci-cd.yml \
              --branch main \
              --commit "$GITHUB_SHA" \
              --status completed \
              --limit 20 \
              --json headSha,conclusion
          )"
          printf '%s' "$RUNS" |
            jq -e --arg sha "$GITHUB_SHA" \
              'any(.[]; .headSha == $sha and .conclusion == "success")' >/dev/null

      - name: Verify pinned Gradle bootstrap
        run: |
          set -euo pipefail
          EXPECTED_DISTRIBUTION_SHA="2ab2958f2a1e51120c326cad6f385153bb11ee93b3c216c5fccebfdfbb7ec6cb"
          EXPECTED_WRAPPER_BLOB="8bdaf60c75ab801e22807dde59e12a8735a34077"
          grep -Fxq "distributionSha256Sum=$EXPECTED_DISTRIBUTION_SHA" gradle/wrapper/gradle-wrapper.properties
          ACTUAL_WRAPPER_BLOB="$(git hash-object gradle/wrapper/gradle-wrapper.jar)"
          test "$ACTUAL_WRAPPER_BLOB" = "$EXPECTED_WRAPPER_BLOB"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run Android tests and lint
        run: ./gradlew testDebugUnitTest assembleDebugAndroidTest lintRelease --stacktrace

      - name: Build signed release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK identity, alignment, signer and digest
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          test -x "$ZIPALIGN"

          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK" 2>&1)"
          printf '%s\n' "$VERIFY_OUTPUT"
          printf '%s\n' "$VERIFY_OUTPUT" | grep -Eq 'Verified using v2 scheme.*true'

          EXPECTED_CERT_SHA256="2aee2ab749ba733b777ef62aa7c8204c9c91d6e15524fed2681be38c9e5bd01e"
          ACTUAL_CERT_SHA256="$(
            printf '%s\n' "$VERIFY_OUTPUT" |
            awk -F': ' '/certificate SHA-256 digest:/ { print tolower($NF); exit }'
          )"
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"

          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          printf '%s\n' "$BADGING"
          printf '%s\n' "$BADGING" | grep -Fq "package: name='com.yasser.ub'"
          if "$AAPT" dump badging "$APK" | grep -q '^application-debuggable'; then
            echo "Release APK must not be debuggable"
            exit 1
          fi

          RELEASE_TAG="${{ inputs.tag }}"
          EXPECTED_VERSION="${RELEASE_TAG#v}"
          printf '%s\n' "$BADGING" | grep -Fq "versionName='$EXPECTED_VERSION'"

          "$ZIPALIGN" -c -P 16 -v 4 "$APK"

          cp "$APK" "app/build/outputs/apk/release/CPEB-University-Booking.apk"
          (
            cd app/build/outputs/apk/release
            sha256sum "CPEB-University-Booking.apk" |
              tee "CPEB-University-Booking.apk.sha256"
            sha256sum -c "CPEB-University-Booking.apk.sha256"
          )

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          gh release create "$TAG" \
            "app/build/outputs/apk/release/CPEB-University-Booking.apk#CPEB-University-Booking.apk" \
            "app/build/outputs/apk/release/CPEB-University-Booking.apk.sha256#SHA-256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "CPEB University Booking $TAG" \
            --notes "Signed Android release configured for the public HTTPS CPEB backend."

