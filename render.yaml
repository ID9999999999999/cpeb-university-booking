services:
  - type: web
    name: cpeb-university-booking-api-v4
    runtime: docker
    branch: main
    region: frankfurt
    plan: free
    autoDeployTrigger: checksPass
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: cpeb-postgres-v4
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN_SECONDS
        value: "7200"
      - key: CORS_ORIGINS
        value: https://cpeb-university-booking-admin-web.onrender.com
      - key: CPEB_DEV_SHOW_VERIFICATION_CODE
        value: "false"
      - key: CPEB_ADMIN_EMAIL
        sync: false
      - key: CPEB_ADMIN_PASSWORD
        sync: false
      - key: CPEB_TECHNICIAN_EMAIL
        sync: false
      - key: CPEB_TECHNICIAN_PASSWORD
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_CONNECTION_TIMEOUT_MS
        value: "10000"
      - key: SMTP_SOCKET_TIMEOUT_MS
        value: "15000"

  - type: web
    name: cpeb-university-booking-admin-web
    runtime: node
    branch: main
    region: frankfurt
    plan: free
    autoDeployTrigger: checksPass
    buildCommand: cd apps/admin-web && npm run ci
    startCommand: cd apps/admin-web && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: CPEB_API_BASE_URL
        value: https://cpeb-university-booking-api-v4.onrender.com

databases:
  - name: cpeb-postgres-v4
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: cpeb_booking
    user: cpeb
    ipAllowList: []
