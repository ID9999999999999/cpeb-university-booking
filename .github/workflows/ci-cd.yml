name: CPEB CI-CD

on:
  push:
    branches:
      - main
      - 'deep-stabilization-*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpeb-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Build and Deep Tests
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cpeb_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cpeb_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cpeb_ci
      JWT_SECRET: cpeb-ci-only-secret-which-is-long-enough-for-tests
      JWT_EXPIRES_IN_SECONDS: 7200
      CPEB_DEV_SHOW_VERIFICATION_CODE: 'true'
      NODE_ENV: test

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Reject critical runtime dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=critical

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply all migrations to clean PostgreSQL
        run: npx prisma migrate deploy

      - name: Verify migration status
        run: npx prisma migrate status

      - name: Seed university resources
        run: npm run seed:resources

      - name: Build NestJS backend
        run: npm run build

      - name: Run backend unit tests with coverage
        run: npm run test:ci

      - name: Run deep PostgreSQL E2E tests
        run: npm run test:e2e -- --runInBand

      - name: Build deployable backend container
        run: docker build -t cpeb-api-ci .

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpeb-backend-coverage
          path: apps/api/coverage
          if-no-files-found: warn
          retention-days: 14

  android:
    name: Android Build and Contract Tests
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: apps/android

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Verify Gradle wrapper JAR before execution
        run: |
          set -euo pipefail
          EXPECTED="$(curl -fsSL https://services.gradle.org/distributions/gradle-9.4.1-wrapper.jar.sha256)"
          ACTUAL="$(sha256sum gradle/wrapper/gradle-wrapper.jar | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Run Android unit/API-contract tests and compile device tests
        run: ./gradlew testDebugUnitTest assembleDebugAndroidTest --stacktrace

      - name: Run Android lint
        run: ./gradlew lintDebug --stacktrace

      - name: Build debug acceptance APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Android debug artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cpeb-android-debug-apk
          path: apps/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
